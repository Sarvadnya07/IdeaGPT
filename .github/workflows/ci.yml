name: IdeaGPT CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

# Principle of least privilege: restrict GITHUB_TOKEN to read-only by default.
# Individual jobs can escalate only if explicitly needed.
permissions:
  contents: read

jobs:
  backend-test-and-lint:
    name: Backend Tests & Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Alembic Migration Drift Check
        run: |
          cd apps/api
          python -m alembic check

      - name: Run Backend Pytest Suite
        run: |
          cd apps/api
          python -m pytest -v

      - name: Python Dependency Audit
        run: |
          pip install pip-audit
          pip-audit -r apps/api/requirements.txt --desc || true

  frontend-test-and-build:
    name: Frontend Tests, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Typecheck
        run: pnpm --filter web exec tsc --noEmit

      - name: Frontend Vitest Unit Tests
        run: pnpm --filter web test

      - name: Production Monorepo Build
        run: pnpm run build

      - name: JavaScript Dependency Audit
        run: pnpm audit --audit-level=high || true
