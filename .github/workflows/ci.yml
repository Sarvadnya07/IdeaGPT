name: IdeaGPT CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-lint:
    name: Backend Tests & Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Alembic Migration Drift Check
        run: |
          cd apps/api
          python -m alembic check

      - name: Run Backend Pytest Suite
        run: |
          cd apps/api
          python -m pytest -v

  frontend-test-and-build:
    name: Frontend Tests, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Typecheck
        run: pnpm --filter web exec tsc --noEmit

      - name: Frontend Vitest Unit Tests
        run: pnpm --filter web test

      - name: Production Monorepo Build
        run: pnpm run build
