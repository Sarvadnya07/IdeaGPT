version: 2
updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    reviewers:
      - "Sarvadnya07"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 5

  # JavaScript/Node dependencies (pnpm/npm)
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    groups:
      web-dependencies:
        patterns:
          - "*"
    reviewers:
      - "Sarvadnya07"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "Sarvadnya07"
    labels:
      - "ci"
      - "security"
    open-pull-requests-limit: 5

  # Docker
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/infrastructure/docker"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
