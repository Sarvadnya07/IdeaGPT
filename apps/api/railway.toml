[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips \"${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}\"'"
healthcheckPath = "/health/live"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
